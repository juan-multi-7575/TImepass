# Scratch composition for developing this bundle without a full
# harness: the two services the plugin injects, then the plugin itself.
#
#   node scratch/driver.mjs
#
# The short timeouts keep the probe step fast; a real profile keeps the defaults.
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-commands'
- name: '../src/index.js'
  config:
    connectTimeoutMs: 3000
    verbose: true
    enableCookieTools: true
